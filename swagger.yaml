                    date_reception:
                      type: string
                      format: date
                    Fournisseur:
                      type: string
                    Magasin:
                      type: string
                    Reference:
                      type: string
                    Devise:
                      type: string
                    Taux_Devise:
                      type: number
                    Produits:
                      type: array
                      items:
                        type: object
                        properties:
                          EAN:
                            type: string
                          Produit:
                            type: string
                          Couleur:
                            type: string
                          Taille:
                            type: string
                          Quantite:
                            type: number
                          Commande:
                            type: integer
                          Prix_Achat_Devise:
                            type: number
                          Remise_Achat:
                            type: number
                          Colis:
                            type: string
                - title: tracking_number
                  type: array
                  items:
                    type: object
                    properties:
                      Entete:
                        type: integer
                      Colis:
                        type: integer
                      Tracking_Number:
                        type: string
            examples:
              confirmation_reception_transfert:
                summary: Confirmer réception transfert
                value:
                  Entete: 12345
                  Magasin: "MAGASIN1"
                  Caisse: 1
                  date_reception: "2026-01-27"
                  heure_reception: "14:30:00"
                  accepter_difference: 1
                  Produits:
                    - Produit: "CHEMISE01"
                      Couleur: "BLEU"
                      Taille: "M"
                      Quantite: 10
              confirmations_expeditions:
                summary: Confirmer expéditions
                value:
                  - Preparation: 456
                    date_preparation: "2026-01-27"
                    heure_preparation: "10:00:00"
                    Produits:
                      - Produit: "CHEMISE01"
                        Couleur: "BLEU"
                        Taille: "M"
                        Quantite: 5
                        Colis: 1
              set_tracking_number:
                summary: Définir numéros de suivi
                value:
                  - Entete: 12345
                    Colis: 1
                    Tracking_Number: "1Z999AA10123456784"
      responses:
