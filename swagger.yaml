            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - apiKey: []
          enseigne: []

  # ==================== NÉGOCE B2B ====================
  /negoce.do:
    post:
      tags:
        - Négoce B2B
      summary: API Négoce B2B
      description: |
        API pour la gestion des pièces commerciales B2B (devis, commandes, BL, factures),
        des clients négoce et des relances.

        **Permission requise :** `api_negoce`

        Actions disponibles (paramètre `action`, insensible à la casse) :
        - `creer_piece` : Créer une pièce commerciale complète (crée un panier, ajoute les lignes, valide)
        - `creer_panier` : Créer un panier (entête seule). Les champs non fournis sont hérités de la fiche client puis du paramétrage dossier négoce
        - `ajouter_lignes_panier` : Ajouter des lignes à un panier existant. Les lignes sans `Prix_Vente` sont valorisées au tarif du panier (remise la plus avantageuse entre le tarif et la remise habituelle du client)
        - `valider_panier` : Valider un panier existant

        `creer_panier` + `ajouter_lignes_panier` + `valider_panier` = le détail, en 3 appels, de ce que `creer_piece` fait en un seul.
        Cette voie permet de constituer un panier progressivement et de le valoriser (consulter `total_ht_panier`) avant de le transformer en pièce.
        - `url_piece` : Récupérer l'URL d'une pièce à partir de son Entete
        - `email_piece` : Envoyer une pièce par email à partir de son Numero_Piece
        - `liste_pieces_a_envoyer` : Lister les pièces qui seraient envoyées par `envoyer_pieces` (aucun email envoyé, aucune modification)
        - `envoyer_pieces` : Envoyer en masse par email les pièces sélectionnées par le filtre (équivalent API de l'écran « Édition des pièces »). Mode `simulation=1` : identique à `liste_pieces_a_envoyer`
        - `creation_client` : Créer un client négoce (enrichissement Pappers si Siret fourni)
        - `relance_client` : Envoyer un email de relance (niveaux 1/2/3) sur le solde débiteur
        - `facturation_affilies` : Facturer les clients affiliés (`affilie=1`) entre 2 dates — agrège les ventes/avoirs magasin par magasin et crée une FACTURE (ou AVOIR) par magasin, puis marque les tickets `Statut=900`. Mode `simulation=1` : ne crée/marque rien, retourne uniquement ce qui serait fait

        **Types de pièces (Nature) :**
        - `DEVIS`, `PROFORMA`, `RESERVATION`, `COMMANDE`, `BL`, `TRANSFERT`, `FACTURE`
      operationId: negoceApi
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [creer_piece, creer_panier, ajouter_lignes_panier, valider_panier, url_piece, email_piece, liste_pieces_a_envoyer, envoyer_pieces, creation_client, relance_client, facturation_affilies]
          description: Action à exécuter (insensible à la casse)
        - name: Enseigne
          in: query
          required: false
          schema:
            type: string
          description: Code enseigne (positionné dans Vars pour le traitement)
      requestBody:
        required: true
        description: Corps JSON brut (RequestContent), parsé selon l'action.
        content:
          application/json:
            schema:
              oneOf:
                - title: creer_piece
                  type: object
                  required:
                    - Client
                    - Nature
                    - Magasin
                  properties:
                    Client:
                      type: integer
                      description: ID du client négoce
                    Nature:
                      type: string
                      enum: [DEVIS, PROFORMA, RESERVATION, COMMANDE, BL, TRANSFERT, FACTURE]
                      description: Type de pièce
                    Magasin:
                      type: string
                      description: Code magasin
                    Date:
                      type: string
                      format: date
                      description: Date de la pièce (défaut = aujourd'hui)
                    Objet:
                      type: string
                      description: Objet/description de la pièce
                    Observations:
                      type: string
                    Priorite:
                      type: integer
                      default: 100
                    Tarif:
                      type: string
                      description: Code tarif (défaut = tarif négoce)
                    Devise:
                      type: string
                      description: Code devise (défaut = devise dossier)
                    Transporteur:
                      type: string
                      description: Code transporteur (défaut = transporteur négoce)
                    ModeReg:
                      type: string
                      description: Mode de règlement (défaut = ModeReg négoce)
                    Representant:
                      type: string
                      description: Code représentant
                    Secteur_Geographique:
                      type: string
                    Intitule_Adresse:
                      type: string
                      description: Intitulé de l'adresse de livraison (requis pour BL et TRANSFERT)
                    Magasin_Destination:
                      type: string
                      description: Magasin destination (pour transferts)
                    Date_Livraison_Souhaitee:
                      type: string
                      format: date
                    Date_Livraison_Prevue:
                      type: string
                      format: date
                    Utilisateur:
                      type: string
                      default: "API"
                    Produits:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProduitNegoce'
                - title: creer_panier
                  type: object
                  description: |
                    Crée le panier (entête seule, sans ligne). Tous les champs autres que Client et Nature
                    sont facultatifs : laissés vides, ils sont hérités de la fiche client puis du paramétrage
                    dossier négoce. Retourne le `Panier` à passer ensuite à `ajouter_lignes_panier`.
                  required:
                    - Client
                    - Nature
                  properties:
                    Client:
                      type: integer
                    Nature:
                      type: string
                      enum: [DEVIS, PROFORMA, RESERVATION, COMMANDE, BL, TRANSFERT, FACTURE]
                    Magasin:
                      type: string
                    Objet:
                      type: string
                    Observations:
                      type: string
                    Priorite:
                      type: integer
                    Tarif:
                      type: string
                    Devise:
                      type: string
                    Transporteur:
                      type: string
                    ModeReg:
                      type: string
                    Delai_Reglement:
                      type: string
                    Representant:
                      type: string
                    Secteur_Geographique:
                      type: string
                    Intitule_Adresse:
                      type: string
                    Date_Livraison_Souhaitee:
                      type: string
                      format: date
                    Date_Livraison_Prevue:
                      type: string
                      format: date
                    Utilisateur:
                      type: string
                      default: "API"
                - title: ajouter_lignes_panier
                  type: object
                  description: |
                    Ajoute des lignes au panier. Le client, la nature et le tarif sont relus sur le panier
                    (pas repris de la requête). Une ligne sans `Prix_Vente` est valorisée au tarif du panier,
                    avec la remise la plus avantageuse entre celle du tarif et la remise habituelle du client ;
                    un produit absent du tarif est ajouté à 0 et signalé dans `produits_sans_prix`.
                    Une ligne dont le produit est fourni seul (sans couleur ni taille) est résolue par recherche SKU.
                    Réponse : `{Panier, Client, Nature, Tarif, nb_lignes_ajoutees, total_ht_panier, produits_sans_prix}`.
                  required:
                    - Panier
                    - Produits
                  properties:
                    Panier:
                      type: integer
                      description: ID du panier à alimenter
                    Produits:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProduitNegoce'
                - title: valider_panier
                  type: object
                  required:
                    - Client
                    - Panier
                    - Nature
                    - Magasin
                  properties:
                    Client:
                      type: integer
                    Panier:
                      type: integer
                      description: ID du panier à valider
                    Nature:
                      type: string
                      enum: [DEVIS, PROFORMA, RESERVATION, COMMANDE, BL, TRANSFERT, FACTURE]
                    Magasin:
                      type: string
                    Date:
                      type: string
                      format: date
                    Observations:
                      type: string
                    Utilisateur:
                      type: string
                - title: url_piece
                  type: object
                  required:
                    - Entete
                  properties:
                    Entete:
                      type: integer
                      description: Numéro d'entête de la pièce
                - title: email_piece
                  type: object
                  required:
                    - Numero_Piece
                  properties:
                    Numero_Piece:
                      type: string
                      description: Numéro de la pièce à envoyer
                    email:
                      type: string
                      description: Adresse destinataire (défaut = email_billing du client)
                - title: liste_pieces_a_envoyer / envoyer_pieces
                  type: object
                  description: |
                    Envoi en masse des pièces commerciales par email — équivalent API de l'écran
                    « Négoce / Édition des pièces » (`negoce-edition-pieces.do`).

                    Les deux actions partagent exactement les mêmes filtres :
                    `liste_pieces_a_envoyer` retourne seulement la sélection (aucun email, aucune écriture),
                    `envoyer_pieces` envoie réellement chaque pièce et passe les pièces envoyées à `Imprime=1`.
                    Le flux conseillé est donc : lister, contrôler, puis envoyer avec le même corps JSON
                    (ou avec la liste d'`Entetes` retenue).

                    Tous les filtres sont facultatifs et se cumulent (ET). Les champs `Entetes`, `Numero_Piece`,
                    `Nature`, `Magasin` et `Client` acceptent indifféremment une valeur simple ou un tableau
                    de valeurs. Les pièces de nature `REGLEMENT` et `NOTE` sont toujours exclues.

                    Sans `deja_envoyees`, seules les pièces jamais envoyées sont traitées : rejouer le même
                    appel n'envoie pas deux fois la même pièce.
                  properties:
                    Entetes:
                      oneOf:
                        - type: integer
                        - type: array
                          items:
                            type: integer
                      description: Entête(s) de pièce à traiter (identifiant interne `negoce_entetes.Entete`)
                    Numero_Piece:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: Numéro(s) de pièce
                    Nature:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: "Nature(s) de pièce, insensible à la casse (FACTURE, AVOIR, BL, COMMANDE, DEVIS, RESERVATION, PROFORMA…)"
                    Magasin:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: Magasin(s) émetteur(s)
                    Client:
                      oneOf:
                        - type: integer
                        - type: array
                          items:
                            type: integer
                      description: Client(s) négoce
                    date_debut:
                      type: string
                      format: date
                      description: Date de pièce minimum (incluse), format AAAA-MM-JJ
                    date_fin:
                      type: string
                      format: date
                      description: Date de pièce maximum (incluse), format AAAA-MM-JJ
                    deja_envoyees:
                      type: integer
                      enum: [0, 1]
                      default: 0
                      description: "`0` (défaut) : pièces jamais envoyées uniquement (`Imprime=0`). `1` : inclure aussi les pièces déjà envoyées (renvoi)"
                    limite:
                      type: integer
                      default: 200
                      description: Nombre maximum de pièces traitées en un appel (maxi 1000). `tronque=1` dans la réponse signale que le filtre en sélectionne davantage
                    email:
                      type: string
                      description: Force le destinataire de TOUS les envois au lieu de l'`email_billing` de chaque client (recette / test)
                    simulation:
                      type: integer
                      enum: [0, 1]
                      default: 0
                      description: "Action `envoyer_pieces` uniquement — si `1`, aucun email n'est envoyé (comportement de `liste_pieces_a_envoyer`)"
                - title: creation_client
                  type: object
                  description: Au moins Nom ou Siret est requis. Si Siret fourni, enrichissement via Pappers.
                  properties:
                    Nom:
                      type: string
                    Siret:
                      type: string
                - title: relance_client
                  type: object
                  required:
                    - Client
                  properties:
                    Client:
                      type: integer
                      description: ID du client à relancer (doit avoir un solde > 0)
                    niveau:
                      type: integer
                      enum: [1, 2, 3]
                      default: 1
                      description: Niveau de relance (1=rappel, 2=relance, 3=mise en demeure)
                    email:
                      type: string
                      description: Destinataire (défaut = email_billing puis email du client)
                - title: facturation_affilies
                  type: object
                  description: |
                    Facture les clients affiliés (`negoce_clients.affilie=1`) sur une période.
                    Pour chaque magasin ayant des ventes/avoirs (`entetes.Statut<>900`) sur [date_debut, date_fin] et
                    rattaché à exactement UN client affilié (adresse de livraison négoce pointant sur le magasin),
                    agrège la quantité nette par produit et valorise selon le `Taux_Affiliation` de la fiche client :
                    - `Taux_Affiliation > 0` : facture le montant HT net des ventes × taux. Pour chaque ligne de vente :
                      `Quantite × Prix_Vente × (1 − remise/100) / (1 + Taux_TVA/100) × Taux_Affiliation/100`,
                      la remise de ligne n'étant prise en compte que si un `Motif` est renseigné (sinon remise = 0).
                    - `Taux_Affiliation = 0` : valorise au tarif du client
                      (remise de ligne = max(remise tarif, `Remise_Habituelle` du client)).

                    Crée une FACTURE (ou AVOIR si total négatif) émise depuis le magasin de la fiche client
                    (`negoce_clients.magasin`), applique l'escompte éventuel (`Taux_Escompte` + produit d'escompte
                    paramétré), puis passe les ventes/avoirs facturés à `Statut=900`. Chaque ligne porte `Ligne_BL=-1`
                    (pas de re-débit stock).
                    Validation tout-ou-rien : la moindre erreur (mapping ambigu, prix tarif manquant, client sans
                    magasin) annule l'ensemble avant toute écriture.

                    Mode simulation (`simulation=1`) : aucune écriture (pas de facture créée, ventes/avoirs non passés à
                    `Statut=900`) ; la réponse décrit les factures qui seraient produites avec le détail des lignes et
                    les montants HT/escompte estimés.
                  required:
                    - date_debut
                    - date_fin
                  properties:
                    date_debut:
                      type: string
                      format: date
                      description: Date de début de période (incluse)
                    date_fin:
                      type: string
                      format: date
                      description: Date de fin de période (incluse) — date portée sur les factures créées
                    client:
                      type: integer
                      description: ID du client négoce affilié (facultatif) — restreint le traitement à ce client
                    simulation:
                      type: integer
                      enum: [0, 1]
                      default: 0
                      description: Si `1`, simulation seule (aucune écriture) — retourne ce qui serait fait
            examples:
              creer_facture:
                summary: "action=creer_piece — créer une facture"
                description: "`POST /api/v2/negoce.do?action=creer_piece&Enseigne=DEMO&api-key=...`"
                value:
                  Client: 138
                  Nature: "FACTURE"
                  Magasin: "DEPOT"
                  Date: "2026-01-27"
                  Produits:
                    - Produit: "CHEMISE01"
                      Couleur: "BLEU"
                      Taille: "M"
                      Quantite: 10
                      Prix_Vente: 45.00
                      Remise_Vente: 10
                      Commentaire: "Livraison urgente"
              creer_bl:
                summary: "action=creer_piece — créer un BL"
                description: "`POST /api/v2/negoce.do?action=creer_piece&Enseigne=DEMO&api-key=...`"
                value:
                  Client: 138
                  Nature: "BL"
                  Magasin: "DEPOT"
                  Intitule_Adresse: "SIEGE"
                  Transporteur: "CHRONOPOST"
                  Produits:
                    - Produit: "PANTALON01"
                      Couleur: "NOIR"
                      Taille: "42"
                      Quantite: 5
              creer_panier:
                summary: "action=creer_panier — étape 1/3 : créer le panier"
                description: |
                  `POST /api/v2/negoce.do?action=creer_panier&Enseigne=DEMO&api-key=...`

                  Retourne le `Panier` (ex. 42) à passer à `ajouter_lignes_panier` puis à `valider_panier`.
                  Les champs non fournis sont hérités de la fiche client puis du paramétrage dossier négoce.
                value:
                  Client: 138
                  Nature: "COMMANDE"
                  Objet: "Réassort automne"
              ajouter_lignes_panier:
                summary: "action=ajouter_lignes_panier — étape 2/3 : alimenter et valoriser"
                description: |
                  `POST /api/v2/negoce.do?action=ajouter_lignes_panier&Enseigne=DEMO&api-key=...`

                  Ici la 1re ligne est valorisée au tarif du panier (ni `Prix_Vente` ni `Remise_Vente` fournis),
                  la 2e impose son prix et sa remise. La réponse renvoie `total_ht_panier`.
                  Rappelable autant de fois que voulu sur le même panier.
                value:
                  Panier: 42
                  Produits:
                    - Produit: "CHEMISE01"
                      Couleur: "BLEU"
                      Taille: "M"
                      Quantite: 10
                    - Produit: "PANTALON01"
                      Couleur: "NOIR"
                      Taille: "42"
                      Quantite: 5
                      Prix_Vente: 39.90
                      Remise_Vente: 5
              valider_panier:
                summary: "action=valider_panier — étape 3/3 : transformer en pièce"
                description: |
                  `POST /api/v2/negoce.do?action=valider_panier&Enseigne=DEMO&api-key=...`

                  Le triplet Client / Panier / Nature doit être celui du panier. Retourne la pièce créée
                  (`Entete`, `Numero_Piece`, `url_piece`).
                value:
                  Client: 138
                  Panier: 42
                  Nature: "COMMANDE"
                  Magasin: "DEPOT"
                  Date: "2026-01-27"
              url_piece:
                summary: "action=url_piece — récupérer l'URL et le XML Factur-X"
                description: "`POST /api/v2/negoce.do?action=url_piece&Enseigne=DEMO&api-key=...`"
                value:
                  Entete: 12345
              email_piece:
                summary: "action=email_piece — envoyer une pièce par email"
                description: "`POST /api/v2/negoce.do?action=email_piece&Enseigne=DEMO&api-key=...`"
                value:
                  Numero_Piece: "FA-2026-00123"
                  email: "client@example.com"
              liste_pieces_a_envoyer:
                summary: "action=liste_pieces_a_envoyer — factures du mois non encore envoyées"
                description: "`POST /api/v2/negoce.do?action=liste_pieces_a_envoyer&Enseigne=DEMO&api-key=...`"
                value:
                  Nature: "FACTURE"
                  date_debut: "2026-08-01"
                  date_fin: "2026-08-31"
              envoyer_pieces_filtre:
                summary: "action=envoyer_pieces — envoyer les factures du mois d'un magasin"
                description: "`POST /api/v2/negoce.do?action=envoyer_pieces&Enseigne=DEMO&api-key=...`"
                value:
                  Nature: ["FACTURE", "AVOIR"]
                  Magasin: "DEPOT"
                  date_debut: "2026-08-01"
                  date_fin: "2026-08-31"
                  limite: 100
              envoyer_pieces_entetes:
                summary: "action=envoyer_pieces — envoyer une liste d'entêtes précise"
                description: "`POST /api/v2/negoce.do?action=envoyer_pieces&Enseigne=DEMO&api-key=...`"
                value:
                  Entetes: [12345, 12346, 12350]
              creation_client:
                summary: "action=creation_client — créer un client par Siret"
                description: "`POST /api/v2/negoce.do?action=creation_client&Enseigne=DEMO&api-key=...`"
                value:
                  Siret: "12345678900012"
              relance_client:
                summary: "action=relance_client — relancer un client (niveau 2)"
                description: "`POST /api/v2/negoce.do?action=relance_client&Enseigne=DEMO&api-key=...`"
                value:
                  Client: 138
                  niveau: 2
              facturation_affilies:
                summary: "action=facturation_affilies — facturer les affiliés sur une période"
                description: "`POST /api/v2/negoce.do?action=facturation_affilies&Enseigne=DEMO&api-key=...`"
                value:
                  date_debut: "2026-05-01"
                  date_fin: "2026-05-31"
                  client: 138
              facturation_affilies_simulation:
                summary: "action=facturation_affilies — simulation (aucune écriture)"
                description: "`POST /api/v2/negoce.do?action=facturation_affilies&Enseigne=DEMO&api-key=...`"
                value:
                  date_debut: "2026-05-01"
                  date_fin: "2026-05-31"
                  simulation: 1
      responses:
        '200':
          description: Succès (le contenu de `data` dépend de l'action)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    description: |
                      Champs selon l'action :
                      - creer_piece / valider_panier : Entete, Nature, Numero_Piece, url_piece
                      - url_piece : url_piece
                      - email_piece : Entete, Numero_Piece, email
                      - liste_pieces_a_envoyer / envoyer_pieces : envoi, nb_pieces_filtre, limite, tronque, nb_pieces, nb_envoyees, nb_erreurs, nb_sans_email, pieces[]
                      - creation_client : Client, Nom, Siret, Ville
                      - relance_client : Client, Nom, email, niveau, Solde
                      - facturation_affilies : simulation, periode, nb_factures, factures[], magasins_ignores[]
                    properties:
                      Entete:
                        type: integer
                      Nature:
                        type: string
                      Numero_Piece:
                        type: string
                      url_piece:
                        type: string
                      Client:
                        type: integer
                      Nom:
                        type: string
                      Siret:
                        type: string
                      Ville:
                        type: string
                      email:
                        type: string
                      niveau:
                        type: integer
                      Solde:
                        type: number
                      simulation:
                        type: integer
                        enum: [0, 1]
                        description: "1 si la réponse provient d'une simulation (aucune écriture), sinon 0 (action facturation_affilies)"
                      periode:
                        type: object
                        description: "Période traitée (action facturation_affilies)"
                        properties:
                          debut:
                            type: string
                            format: date
                          fin:
                            type: string
                            format: date
                      nb_factures:
                        type: integer
                        description: "Nombre de pièces créées — ou qui seraient créées en simulation (action facturation_affilies)"
                      factures:
                        type: array
                        description: "Pièces créées — ou projetées en simulation (action facturation_affilies)"
                        items:
                          type: object
                          properties:
                            magasin:
                              type: string
                              description: Magasin des ventes (dont les tickets sont passés à Statut=900)
                            magasin_emetteur:
                              type: string
                              description: Magasin émetteur de la facture (negoce_clients.magasin)
                            client:
                              type: integer
                            entete:
                              type: integer
                              description: "Présent en mode réel uniquement (simulation=0)"
                            nature:
                              type: string
                              description: "FACTURE ou AVOIR — présent en mode réel uniquement (simulation=0)"
                            numero_piece:
                              type: string
                              description: "Présent en mode réel uniquement (simulation=0)"
                            url_piece:
                              type: string
                              description: "URL de téléchargement (PDF) de la pièce commerciale créée — présent en mode réel uniquement (simulation=0)"
                            tarif:
                              type: string
                              description: "Tarif de la fiche client — présent en simulation uniquement (simulation=1)"
                            devise:
                              type: string
                              description: "Présent en simulation uniquement (simulation=1), si renseignée sur la fiche client"
                            intitule_adresse:
                              type: string
                              description: "Adresse de livraison retenue — présent en simulation uniquement (simulation=1)"
                            montant_ht_estime:
                              type: number
                              description: "Montant HT estimé (avant escompte) — présent en simulation uniquement (simulation=1)"
                            taux_escompte:
                              type: number
                              description: "Taux d'escompte du client — présent en simulation uniquement (simulation=1)"
                            escompte_estime:
                              type: number
                              description: "Escompte estimé (négatif) — présent en simulation uniquement (simulation=1)"
                            lignes:
                              type: array
                              description: "Lignes prévues de la facture — présent en simulation uniquement (simulation=1)"
                              items:
                                type: object
                                properties:
                                  produit:
                                    type: string
                                  couleur:
                                    type: string
                                  taille:
                                    type: string
                                  designation:
                                    type: string
                                  quantite:
                                    type: number
                                    description: Quantité nette (ventes − avoirs)
                                  prix_vente:
                                    type: number
                                    description: Prix unitaire retenu (tarif client, ou prix synthétique issu du Taux_Affiliation)
                                  remise_vente:
                                    type: number
                                  ligne_bl:
                                    type: integer
                                    description: Toujours -1 (pas de re-débit stock)
                      envoi:
                        type: integer
                        enum: [0, 1]
                        description: "1 si les emails ont réellement été envoyés, 0 pour une simple liste (actions liste_pieces_a_envoyer / envoyer_pieces)"
                      nb_pieces_filtre:
                        type: integer
                        description: "Nombre total de pièces correspondant au filtre, avant application de `limite`"
                      limite:
                        type: integer
                        description: "Limite effectivement appliquée"
                      tronque:
                        type: integer
                        enum: [0, 1]
                        description: "1 si le filtre sélectionne plus de pièces que la limite (rappeler l'action pour traiter la suite)"
                      nb_pieces:
                        type: integer
                        description: "Nombre de pièces retournées dans `pieces[]`"
                      nb_envoyees:
                        type: integer
                        description: "Nombre de pièces effectivement envoyées"
                      nb_erreurs:
                        type: integer
                        description: "Nombre de pièces en échec d'envoi"
                      nb_sans_email:
                        type: integer
                        description: "Nombre de pièces sans adresse email (non envoyées)"
                      pieces:
                        type: array
                        description: "Détail pièce par pièce (actions liste_pieces_a_envoyer / envoyer_pieces)"
                        items:
                          type: object
                          properties:
                            entete:
                              type: integer
                            date:
                              type: string
                              format: date
                            magasin:
                              type: string
                            nature:
                              type: string
                            numero_piece:
                              type: string
                            client:
                              type: integer
                            nom:
                              type: string
                            total_ht:
                              type: number
                            total_ttc:
                              type: number
                            devise:
                              type: string
                            deja_envoyee:
                              type: integer
                              enum: [0, 1]
                              description: "État `Imprime` de la pièce AVANT traitement"
                            email:
                              type: string
                              description: "Destinataire retenu (email_billing du client, ou `email` imposé dans la requête)"
                            statut:
                              type: string
                              enum: [a_envoyer, envoyee, erreur, sans_email]
                              description: "`a_envoyer` en mode liste/simulation, sinon le résultat de l'envoi"
                            erreur:
                              type: string
                              description: "Message d'erreur si statut=erreur, sinon vide"
                      magasins_ignores:
                        type: array
                        description: "Magasins non facturés et leur raison (action facturation_affilies)"
                        items:
                          type: object
                          properties:
                            magasin:
                              type: string
                            raison:
                              type: string
              example:
                result: ok
                data:
                  Entete: 12345
                  Nature: "FACTURE"
                  Numero_Piece: "FA-2026-00123"
                  url_piece: "https://example.com/negoce-edition-pieces.do?Entete=12345"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_action:
                  value:
                    result: ko
                    error_message: "missing action"
                client_non_trouve:
                  value:
                    result: ko
                    error_message: "client non trouvé"
                magasin_non_trouve:
                  value:
                    result: ko
                    error_message: "magasin non trouvé"
                nature_inconnue:
                  value:
                    result: ko
                    error_message: "Nature inconnue"
                produit_non_trouve:
                  value:
                    result: ko
                    error_message: "Produit non trouvé(S) : INCONNU BLEU M"
                adresse_requise_bl:
                  value:
                    result: ko
                    error_message: "une adresse de livraison est nécessaire pour le BL"
                adresse_requise_transfert:
                  value:
                    result: ko
                    error_message: "une adresse de livraison est nécessaire pour le TRANSFERT"
                numero_piece_obligatoire:
                  value:
                    result: ko
                    error_message: "Numero_Piece obligatoire"
                nom_ou_siret:
                  value:
                    result: ko
                    error_message: "Nom ou Siret obligatoire"
                pas_de_solde:
                  value:
                    result: ko
                    error_message: "Ce client n'a pas de solde débiteur"
                facturation_affilies_annulee:
                  value:
                    result: ko
                    error_message: "Facturation affilies annulee (tout ou rien) : magasin LYON01 (client 138, tarif NEGOCE) : produits sans prix : CHEMISE01 BLEU M"
      security:
        - apiKey: []
          enseigne: []

  # ==================== TAX-FREE ====================
  /planet-pii.do:
    get:
      tags:
        - Tax-Free
      summary: Export XML Tax-Free (Planet PII)
      description: |
        Exporte les données d'une transaction au format XML Planet PII pour le traitement tax-free.
        
        **Permission requise :** `api_planet_pii`
        
        Le fichier XML contient :
        - Données marchand (nom, adresse, TVA)
        - Détails transaction (date, heure, numéro facture)
        - Lignes articles avec TVA
        - Méthodes de paiement
        - Données client (si disponibles)
      operationId: planetPiiExport
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Entete
          in: query
          required: true
          schema:
            type: integer
          description: Numéro d'entête du ticket (VENTE ou AVOIR)
      responses:
        '200':
          description: Fichier XML Planet PII
          content:
            text/xml:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="Planet_PII.XML"'
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                entete_not_found:
                  value:
                    result: ko
                    error_message: "Entete not found"
      security:
        - apiKey: []
          enseigne: []


  # ==================== RAPPORTS ====================
  /generation-rapports.do:
    post:
      tags:
        - Rapports
      summary: Générer une URL de rapport
      description: |
        Génère une URL pour télécharger un rapport au format PDF ou HTML.
        
        **Permission requise :** `api_generation_rapports`
        
        Le rapport est identifié par son ID dans la table `fat` (Type='document').
        Les paramètres additionnels sont passés au rapport pour filtrer les données.
      operationId: generationRapports
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_rapport
              properties:
                id_rapport:
                  type: string
                  description: ID du rapport dans la table fat (Type='document')
                parametres:
                  type: array
                  description: Paramètres additionnels pour le rapport
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Nom du paramètre
                      value:
                        type: string
                        description: Valeur du paramètre
                format:
                  type: string
                  enum: [pdf, html]
                  default: pdf
                  description: Format de sortie (pdf ou html)
            example:
              id_rapport: "12345"
              parametres:
                - name: "Date_Debut"
                  value: "2026-01-01"
                - name: "Date_Fin"
                  value: "2026-01-31"
              format: "pdf"
      responses:
        '200':
          description: URL du rapport générée
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
