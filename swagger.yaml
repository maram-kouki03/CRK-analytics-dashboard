          schema:
            type: string
          description: Code du magasin expéditeur
          example: "OPERA"
        - name: magasin-destinataire
          in: query
          required: true
          schema:
            type: string
          description: Code du magasin destinataire
          example: "PARIS"
        - name: utilisateur-expediteur
          in: query
          required: true
          schema:
            type: string
          description: Identifiant de l'utilisateur expéditeur
          example: "ESHOP"
        - name: message
          in: query
          required: true
          schema:
            type: string
          description: Contenu du message
          example: "Veuillez expédier le transfert 123 à PARIS svp"
      responses:
        '200':
          description: Message envoyé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "magasin-destinataire not found"
      security:
        - apiKey: []
          enseigne: []

  /query.do:
    post:
      tags:
        - Import Divers
      summary: Exécuter une requête SQL
      description: |
        Exécute une requête SQL en lecture seule.
        
        ⚠️ Requiert la permission `api_query`.
      operationId: executeQuery
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Requête SQL SELECT
            example: "SELECT Produit, Designation FROM produits LIMIT 5"
      responses:
        '200':
          description: Résultat de la requête
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: array
                    items:
                      type: object
              example:
                result: ok
                data:
                  - Produit: "TSHIRT-001"
                    Designation: "T-shirt coton"
                  - Produit: "CHEMISE01"
                    Designation: "Chemise lin"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  # ==================== CATALOGUE ====================
  /catalogue-web.do:
    get:
      tags:
        - Catalogue
      summary: Catalogue produits e-commerce
      description: |
        Retourne le catalogue des produits e-commerce (`eCommerce=1`) : SKU, EAN,
        désignation, prix, photos (URL CDN absolue), etc.

        **Permission requise :** `catalogue`

        Permet de filtrer par date de dernière modification (`last-call`, sur `Last_Change`),
        par magasin (`Magasin`, détermine le tarif appliqué) et par produit (`Produit`).
        Sans `Magasin`, le tarif vide (`''`) est utilisé.
      operationId: getCatalogueWeb
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: output-format
          in: query
          required: true
          schema:
            type: string
            enum: [tsv, csv, json]
          description: Format de sortie
          example: "json"
        - name: last-call
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Date de dernière synchronisation ; seuls les produits dont `Last_Change`
            est postérieur sont retournés. Défaut 1900-01-01 00:00:00.
          example: "2026-01-01 00:00:00"
        - name: Magasin
          in: query
          required: false
          schema:
            type: string
          description: Code magasin (détermine le tarif applicable)
          example: "PARIS"
        - name: Produit
          in: query
          required: false
          schema:
            type: string
          description: Filtrer sur un produit spécifique
          example: "TSHIRT-001"
      responses:
        '200':
          description: Catalogue produits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Sku:
                      type: integer
                    EAN:
                      type: string
                    Reference_Fournisseur:
                      type: string
                    Produit:
                      type: string
                    Couleur:
                      type: string
                    Taille:
                      type: string
                    Designation:
                      type: string
                    Saison:
                      type: string
                    Rayon:
                      type: string
                    Famille:
                      type: string
                    SousFamille:
                      type: string
                    Marque:
                      type: string
                    Collection:
                      type: string
                    Modele:
                      type: string
                    Matiere:
                      type: string
                    Decimales_Quantite:
                      type: integer
                    Conditionnement_Achat:
                      type: number
                    Conditionnement_Vente:
                      type: number
                    Date_Creation:
                      type: string
                    Date_Modification:
                      type: string
                    Descriptif:
                      type: string
                    Serialise:
                      type: integer
                    Lien_Externe:
                      type: string
                    Actif:
                      type: integer
                    Fournisseur:
                      type: string
                    Exclure_Fidelite:
                      type: integer
                    Cle_mep:
                      type: string
                    Tags:
                      type: string
                    Emplacement:
                      type: string
                    Unite:
                      type: string
                    Last_Change:
                      type: string
                    Type_Produit:
                      type: string
                    Code_Douanes:
                      type: string
                    Poids:
                      type: number
                    Volume:
                      type: number
                    Pays_Production:
                      type: string
                    Prix_Vente:
                      type: number
                    Remise_Vente:
                      type: number
                    Motif:
                      type: string
                    Photo1:
                      type: string
                    Photo2:
                      type: string
                    Photo3:
                      type: string
                    Photo4:
                      type: string
                    Photo5:
                      type: string
                    Photo6:
                      type: string
                    Photo7:
                      type: string
                    Photo8:
                      type: string
                    Force_Produit:
                      type: string
                    Saison_Gestion:
                      type: string
              example:
                - Sku: 12345
                  EAN: "3760123456789"
                  Produit: "TSHIRT-001"
                  Couleur: "BLANC"
                  Taille: "M"
                  Designation: "T-shirt coton bio"
                  Prix_Vente: 49.90
                  Remise_Vente: 0
                  Photo1: "https://cdn.example.com/photos/TSHIRT-001-BLANC-1.jpg"
                  Photo2: ""
                  Marque: "MARQUE1"
                  Rayon: "TEXTILE"
                  Famille: "HAUTS"
                  SousFamille: "T-SHIRTS"
                  Saison: "PE2026"
                  Poids: 0.2
                  Actif: 1
            text/tsv:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_format:
                  value:
                    result: ko
                    error_message: "missing output-format"
                invalid_format:
                  value:
                    result: ko
                    error_message: "invalid output-format"
                magasin_not_found:
                  value:
                    result: ko
                    error_message: "Magasin not found"
      security:
        - apiKey: []
          enseigne: []

