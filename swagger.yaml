openapi: 3.0.3
info:
  title: Joolan API
  description: |
    API REST pour la gestion des données Joolan (stocks, clients, tickets, produits, logistique, négoce B2B, etc.)
    
    ## Authentification
    Toutes les requêtes nécessitent :
    - `enseigne` : nom de l'enseigne (base de données)
    - `api-key` : clé API avec les permissions appropriées
    
    ## Formats d'import
    Les APIs d'import acceptent plusieurs formats dans le body :
    - JSON (tableau d'objets)
    - XLSX (fichier Excel)
    - TSV (séparateur tabulation)
    - CSV (séparateur point-virgule `;`)
    
    L'ordre des colonnes est libre, seuls les noms doivent correspondre.
    
    ## Permissions API
    Chaque endpoint nécessite une permission spécifique, matérialisée par la colonne
    `api_<permission>` de la table `api_keys` (ex. permission `stock` → colonne `api_stock`).

    | Permission (`api_…`) | Endpoint(s) |
    |---|---|
    | `api_stock` | `/stock.do`, `/image-stocks.do`, `/image-full-stocks.do` |
    | `api_recherche_clients` | `/recherche-clients.do` |
    | `api_import_clients` | `/import-clients.do` |
    | `api_export_tickets` | `/export-tickets.do` |
    | `api_import_tickets` | `/import-tickets.do` |
    | `api_annulation_tickets` | `/annulation-ticket.do` |
    | `api_ticket_pdf` | `/ticket-pdf.do` |
    | `api_compteurs_passages` | `/import-compteurs-passages.do` |
    | `api_import_produits` | `/import-produits.do` |
    | `api_import_tarifs` | `/import-tarifs.do` |
    | `api_import_produits_associes` | `/import-produits-associes.do` |
    | `api_import_champs_perso` | `/import-champs-perso.do` |
    | `api_import_min_max` | `/import-min-max.do` |
    | `api_import_fournisseurs` | `/import-fournisseurs.do` |
    | `api_import_receptions` | `/import-receptions.do`, `/import-bl-fournisseur.do`, `/associer-receptions-commandes.do` |
    | `api_import_scanners` | `/import-scanners.do` |
    | `api_import_transferts` | `/import-transferts.do` |
    | `api_import_commandes_fournisseurs` | `/import-commandes-fournisseurs.do` |
    | `api_import_image_stock` | `/import-image-stock.do` |
    | `api_envoyer_message` | `/envoyer-message.do` |
    | `api_catalogue` | `/catalogue-web.do` |
    | `api_logistique` | `/logistique.do` |
    | `api_negoce` | `/negoce.do` |
    | `api_planet_pii` | `/planet-pii.do` |
    | `api_generation_rapports` | `/generation-rapports.do` |
    | `api_query` | `/query.do` |
    | *(aucune)* | `/ean-existe.do` (pas de contrôle de clé API) |
  version: 2.0.0
  contact:
    name: Joolan
    email: serge@joolan.com

servers:
  - url: https://{domain}/api/v2
    variables:
      domain:
        default: www.example.com
        description: Domaine de l'enseigne

tags:
  - name: Catalogue
    description: Catalogue produits e-commerce
  - name: Stock
    description: Consultation des stocks
  - name: Clients
    description: Gestion des clients
  - name: Tickets
    description: Export et gestion des tickets
  - name: Import Produits
    description: Import de données produits
  - name: Import Mouvements
    description: Import de réceptions, transferts, etc.
  - name: Import Divers
    description: Autres imports
  - name: Logistique
    description: API logistique (réceptions, expéditions, tracking)
  - name: Négoce B2B
    description: Gestion des pièces commerciales B2B (devis, commandes, BL, factures)
  - name: Tax-Free
    description: Export données tax-free (Planet PII)
  - name: Rapports
    description: Génération de rapports PDF/HTML

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: api-key
      description: Clé API avec permissions appropriées
    enseigne:
      type: apiKey
      in: query
      name: enseigne
      description: Nom de l'enseigne

  parameters:
    enseigne:
      name: enseigne
      in: query
      required: true
      schema:
        type: string
      description: Nom de l'enseigne
    apiKey:
      name: api-key
      in: query
      required: true
      schema:
        type: string
      description: Clé API

  schemas:
    SuccessResponse:
      type: object
      properties:
        result:
          type: string
          enum: [ok]
        data:
          type: object
    
    ErrorResponse:
      type: object
      properties:
        result:
          type: string
          enum: [ko]
        error_message:
          type: string

    ImportResponse:
      type: object
      properties:
        result:
          type: string
          enum: [ok]
        data:
          type: object
          properties:
            imported:
              type: integer
              description: Nombre de lignes importées

    AdresseLivraison:
      type: object
      properties:
        Nom:
          type: string
        Adresse1:
          type: string
        Adresse2:
          type: string
        Adresse3:
          type: string
        Code_Postal:
          type: string
        Ville:
          type: string
        Pays:
          type: string
        Pays_Code3:
          type: string
        Pays_Code2:
          type: string
        Pays_Code_iso:
          type: string
        Contact:
          type: string
        Telephone:
          type: string
        email:
          type: string

    ProduitLogistique:
      type: object
      properties:
        Ligne:
          type: integer
        SKU:
          type: integer
        EAN:
          type: string
        Reference_Fournisseur:
          type: string
        Produit:
          type: string
        Couleur:
          type: string
        Taille:
          type: string
        Quantite:
          type: number

    ProduitNegoce:
      type: object
      properties:
        Produit:
          type: string
          description: Code produit
        Couleur:
          type: string
        Taille:
          type: string
        Designation:
          type: string
        Quantite:
          type: number
        Prix_Vente:
          type: number
        Remise_Vente:
          type: number
        Commentaire:
          type: string
          description: Commentaire de ligne (alimente negoce_lignes.Commentaire)
        Colis:
          type: integer
          default: 1
        Numero_Serie:
          type: string
        Ligne_Commande:
          type: integer
        Ligne_BL:
          type: integer

paths:
  # ==================== STOCK ====================
  /stock.do:
    get:
      tags:
        - Stock
      summary: Consulter le stock d'un produit
      description: Retourne les informations de stock pour un produit donné
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Produit
          in: query
          required: true
          schema:
            type: string
          description: Code produit
          example: "TSHIRT-001"
        - name: Couleur
          in: query
          required: false
          schema:
            type: string
          description: Code couleur (optionnel)
          example: "BLANC"
        - name: Taille
          in: query
          required: false
          schema:
            type: string
          description: Code taille (optionnel)
          example: "M"
        - name: Magasins
          in: query
          required: false
          schema:
            type: string
          description: Liste des magasins séparés par point-virgule
          example: "PARIS;LYON"
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Magasin:
                          type: string
                        Produit:
                          type: string
                        Couleur:
                          type: string
                        Taille:
                          type: string
                        En_Stock:
                          type: number
                        Disponible:
                          type: number
                        En_Reservation:
                          type: number
                        Sku:
                          type: integer
                        EAN:
                          type: string
              example:
                result: ok
                data:
                  - Magasin: "PARIS"
                    Produit: "TSHIRT-001"
                    Couleur: "BLANC"
                    Taille: "M"
                    En_Stock: 25
                    Disponible: 20
                    En_Reservation: 5
                    Sku: 12345
                    EAN: "3760123456789"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /ean-existe.do:
    get:
      tags:
        - Stock
      summary: Vérifier si un EAN existe
      description: |
        Vérifie l'existence d'un code EAN dans la base et retourne les informations produit associées.

        ⚠️ Cet endpoint n'effectue **aucun contrôle de clé API** (`check_api_key` n'est pas appelé).

        La réponse est en **texte brut** (pas du JSON) :
        - Si l'EAN existe : `OK` suivi de 8 lignes (séparateur `\n`) : EAN, `Produit Couleur Taille`, Désignation, Unité, Marque, Prix de vente formaté, Remise formatée.
        - Si l'EAN n'existe pas : `KO` suivi de l'EAN demandé.

        Si `enseigne` ou `ean` est absent, la requête se termine sans aucun contenu.
      operationId: checkEan
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - name: ean
          in: query
          required: true
          schema:
            type: string
          description: Code EAN à vérifier
          example: "3760123456789"
      responses:
        '200':
          description: Réponse en texte brut (OK + détails produit, ou KO + EAN)
          content:
            text/plain:
              schema:
                type: string
              example: |
                OK
                3760123456789
                TSHIRT-001 BLANC M
                T-shirt coton
                PIECE
                MaMarque
                19,90 €
                0 %
      security:
        - enseigne: []

  # ==================== CLIENTS ====================
  /recherche-clients.do:
    post:
      tags:
        - Clients
      summary: Rechercher des clients
      description: Recherche de clients par critères
      operationId: searchClients
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Search:
                  type: array
                  items:
                    type: object
                    properties:
                      Field:
                        type: string
                        description: "Nom du champ (ex: Email, Mobile, Carte_Fidelite)"
                      Value:
                        type: string
                        description: Valeur recherchée
            example:
              Search:
                - Field: Email
                  Value: client@example.com
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
              example:
                result: ok
                count: 1
                data:
                  - Client: 138
                    Nom: "DUPONT"
                    Prenom: "Jean"
                    Email: "client@example.com"
                    Mobile: "+33612345678"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /import-clients.do:
    post:
      tags:
        - Clients
      summary: Importer des clients
      description: |
        Import de fiches clients (création ou mise à jour sur clé unique).

        **Permission requise :** `import_clients`

        Formats acceptés : JSON, XLSX, TSV, CSV. L'ordre des colonnes est libre ;
        seules les colonnes correspondant à un champ de la table `clients` sont importées.
        - Colonne `Categorie` : alimente automatiquement la table `categories_clients`.
        - Colonnes préfixées `perso_<nom>` : créées comme champs personnalisés (`liste_champs_perso` / `champs_perso`).
      operationId: importClients
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  Client:
                    type: integer
                    description: Identifiant client (clé pour mise à jour)
                  Nom:
                    type: string
                  Prenom:
                    type: string
                  email:
                    type: string
                  Mobile:
                    type: string
                  Adresse:
                    type: string
                  CodePostal:
                    type: string
                  Ville:
                    type: string
                  Carte_Fidelite:
                    type: string
                  Categorie:
                    type: string
                    description: Catégorie client (créée si inexistante)
            example:
              - Nom: "DUPONT"
                Prenom: "Jean"
                email: "jean.dupont@example.com"
                Mobile: "+33612345678"
                Ville: "PARIS"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi — liste des clients créés ou modifiés
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Client:
                          type: integer
                        Nom:
                          type: string
                        Prenom:
                          type: string
                        email:
                          type: string
                        Carte_Fidelite:
                          type: string
              example:
                result: ok
                data:
                  - Client: 138
                    Nom: "DUPONT"
                    Prenom: "Jean"
                    email: "jean.dupont@example.com"
                    Carte_Fidelite: ""
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  # ==================== TICKETS ====================
  /export-tickets.do:
    get:
      tags:
        - Tickets
      summary: Exporter les tickets d'une journée
      description: Retourne les entêtes, lignes et règlements des tickets d'une date donnée
      operationId: exportTickets
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date au format AAAA-MM-JJ
          example: "2026-01-15"
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    properties:
                      entetes:
                        type: array
                        items:
                          type: object
                      lignes:
                        type: array
                        items:
                          type: object
                      reglements:
                        type: array
                        items:
                          type: object
              example:
                result: ok
                data:
                  entetes:
                    - Entete: 12345
                      Magasin: "PARIS"
                      Date: "2026-01-15"
                      Nature: "VENTE"
                      Total_TTC: 149.90
                  lignes:
                    - Entete: 12345
                      Produit: "TSHIRT-001"
                      Couleur: "BLANC"
                      Taille: "M"
                      Quantite: 2
                      Prix_Vente: 49.90
                  reglements:
                    - Entete: 12345
                      Mode: "CB"
                      Montant: 149.90
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /annulation-ticket.do:
    post:
      tags:
        - Tickets
      summary: Annuler un ticket
      description: Annule un ticket existant en indiquant son numéro d'entête et un motif d'annulation
      operationId: cancelTicket
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Entete
          in: query
          required: true
          schema:
            type: integer
          description: Numéro d'entête du ticket à annuler
          example: 12345
        - name: Motif
          in: query
          required: true
          schema:
            type: string
          description: Motif de l'annulation
          example: "Erreur de saisie"
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "Motif parameter missing"
      security:
        - apiKey: []
          enseigne: []

  /ticket-pdf.do:
    get:
      tags:
        - Tickets
      summary: Générer le PDF d'un ticket
      description: |
        Retourne le ticket au format PDF, encodé en base64 dans la réponse JSON
        (champ `pdf_content`). Le format de rendu est choisi via le paramètre `format`.
      operationId: getTicketPdf
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Entete
          in: query
          required: true
          schema:
            type: integer
          description: Numéro d'entête du ticket
          example: 12345
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [receipt, A4]
          description: "Format de rendu du PDF : receipt (ticket de caisse) ou A4"
          example: "receipt"
      responses:
        '200':
          description: Succès, PDF encodé en base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  pdf_content:
                    type: string
                    format: byte
                    description: Contenu du fichier PDF encodé en base64
              example:
                result: ok
                pdf_content: "JVBERi0xLjQKJeLjz9MK...=="
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "document not found or download error"
      security:
        - apiKey: []
          enseigne: []

  /import-tickets.do:
    post:
      tags:
        - Tickets
      summary: Importer des tickets de caisse
      description: |
        Importe une liste de tickets (ventes, avoirs, acomptes, réservations, devis, proformas, commandes, BL...).
        Le corps est un **tableau JSON** d'entêtes ; chaque entête contient ses `Lignes` et `Reglements`.
        La réponse renvoie, pour chaque entête, la correspondance entre l'`ID` fourni et le numéro d'`Entete` créé.
      operationId: importTickets
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Magasins_Stocks
          in: query
          required: false
          schema:
            type: string
          description: >
            Liste de magasins (séparés par des virgules) sur lesquels puiser le stock.
            Si renseigné et que la vente présente des produits manquants, des demandes de
            transfert inter-magasins sont générées automatiquement.
          example: "'PARIS','OPERA'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  ID:
                    type: string
                  Date:
                    type: string
                    format: date
                  Heure:
                    type: string
                  Magasin:
                    type: string
                  Caisse:
                    type: integer
                  Nature:
                    type: string
                    enum: [VENTE, AVOIR, ACOMPTE, RESERVATION, DEVIS, PROFORMA, COMMANDE, BL, "AJUSTEMENT STOCK"]
                  Client:
                    type: integer
                  Vendeur:
                    type: string
                  Utilisateur:
                    type: string
                  Pays_Code3:
                    type: string
                  Observation:
                    type: string
                  Date_Livraison:
                    type: string
                    format: date
                  Adresse_Livraison:
                    type: object
                    properties:
                      Intitule_Adresse:
                        type: string
                      Nom:
                        type: string
                      Adresse1:
                        type: string
                      Adresse2:
                        type: string
                      Adresse3:
                        type: string
                      Code_Postal:
                        type: string
                      Ville:
                        type: string
                      Pays:
                        type: string
                      Contact:
                        type: string
                      Telephone:
                        type: string
                      email:
                        type: string
                  Lignes:
                    type: array
                    items:
                      type: object
                      properties:
                        Produit:
                          type: string
                        Produit_if_not_exists:
                          type: string
                        Couleur:
                          type: string
                        Taille:
                          type: string
                        Designation:
                          type: string
                        Quantite:
                          type: number
                        Prix_Normal:
                          type: number
                        Prix_Vente:
                          type: number
                        Remise_Vente:
                          type: number
                        Motif:
                          type: string
                        Numero_Serie:
                          type: string
                        Taux_TVA:
                          type: number
                  Reglements:
                    type: array
                    items:
                      type: object
                      properties:
                        Montant:
                          type: number
                        ModeReg:
                          type: string
                        Libelle:
                          type: string
                        Echeance:
                          type: string
                          format: date
                        EnteteLiee:
                          type: integer
                        Reference:
                          type: string
            example:
              - Magasin: "OPERA"
                Caisse: 1
                Nature: "VENTE"
                Vendeur: "SERGE"
                Lignes:
                  - Produit: "ANGELA"
                    Couleur: "BLEU"
                    Taille: "S"
                    Designation: "Chemise Angela Coton"
                    Quantite: 1
                    Prix_Vente: 175
                    Taux_TVA: 0
                Reglements:
                  - Montant: 175
                    ModeReg: "300"
                    Libelle: "CARTE BANCAIRE"
                    Reference: "transaction CB 1234"
      responses:
        '200':
          description: |
            Résultat de l'import. `result` vaut `ok` si tous les tickets ont été créés,
            `ko` si au moins une entête est en erreur. `data` liste la correspondance
            ID → Entete (ou ID → Erreur) pour chaque ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok, ko]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: string
                        Entete:
                          type: integer
                        Erreur:
                          type: string
              example:
                result: ok
                data:
                  - ID: "CMD-001"
                    Entete: 12345
        '400':
          description: Erreur globale (clé API, JSON invalide, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "bad json"
      security:
        - apiKey: []
          enseigne: []

  # ==================== COMPTEURS ====================
  /import-compteurs-passages.do:
    post:
      tags:
        - Import Divers
      summary: Importer des compteurs de passages
      description: |
        Import des données de compteurs de passages en magasin.

        **Permission requise :** `compteurs_passages`

        Formats acceptés : JSON, XLSX, TSV, CSV

        L'ordre des colonnes est libre. Le champ `Magasin` est obligatoire (doit exister
        dans la table `magasins`). Les lignes sans `Magasin` sont ignorées.
      operationId: importCompteursPassages
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Magasin
                properties:
                  Magasin:
                    type: string
                    maxLength: 30
                    description: Code magasin (doit exister)
                  Date:
                    type: string
                    description: "Date AAAA-MM-JJ ou JJ/MM/AAAA (défaut = aujourd'hui)"
                  Heure:
                    type: string
                    description: "Heure HH:MM:SS (défaut = 00:00:00)"
                  Compteur:
                    type: integer
                    description: Numéro du compteur (défaut = 0)
                  Entrees:
                    type: integer
                    description: Nombre d'entrées (défaut = 0)
                  Sorties:
                    type: integer
                    description: Nombre de sorties (défaut = 0)
            example:
              - Magasin: PARIS
                Date: "2026-01-26"
                Heure: "10:00:00"
                Compteur: 1
                Entrees: 150
                Sorties: 120
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
              example:
                result: ok
                data:
                  imported: 2
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                magasin_absent:
                  value:
                    result: ko
                    error_message: champ Magasin absent
                magasin_inexistant:
                  value:
                    result: ko
                    error_message: "1 ligne(s) avec Magasin inexistant (INCONNU)"
      security:
        - apiKey: []
          enseigne: []

  # ==================== IMPORT PRODUITS ====================
  /import-produits.do:
    post:
      tags:
        - Import Produits
      summary: Importer des produits
      description: |
        Import de produits avec leurs déclinaisons (couleurs, tailles).

        **Permission requise :** `import_produits`

        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).
        Le séparateur de champs et de lignes est détecté automatiquement.

        Colonnes obligatoires : `Produit`, `Couleur`, `Taille`.

        Les autres colonnes sont mappées automatiquement sur les colonnes des tables
        `produits`, `skus`, `produits_couleurs`, `produits_tva_pays` et `tarifsproduits`
        (ex. `Designation`, `EAN`, `Reference_Fournisseur`, `Rayon`, `Famille`, `SousFamille`,
        `Marque`, `Fournisseur`, `Saison`, `Saison_Gestion`, `Cle_MEP`, `Force_Produit`,
        `Prix_Achat`, `Remise_Achat`, `Prix_Vente`, `Remise_Vente`, `Taux_TVA_Vente`,
        `Taux_TVA_Achat`, `Conditionnement_Achat`, `Conditionnement_Vente`, `Devise`, `Tarif`...).
        Les valeurs décimales acceptent la virgule.

        Champs personnalisés : préfixer la colonne par `Perso_` (produits),
        `PersoCouleur_` (produits_couleurs) ou `PersoSku_` (skus).
      operationId: importProduits
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: reset_tarif
          in: query
          required: false
          schema:
            type: string
          description: >
            Si présent, supprime les tarifsproduits existants des tarifs présents
            dans le fichier (produits non préfixés par `$`) avant réimport.
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Produit
                  - Couleur
                  - Taille
                properties:
                  Produit:
                    type: string
                    maxLength: 30
                  Designation:
                    type: string
                    maxLength: 70
                  Couleur:
                    type: string
                    maxLength: 30
                  Taille:
                    type: string
                    maxLength: 30
                  EAN:
                    type: string
                    maxLength: 30
                  Rayon:
                    type: string
                  Famille:
                    type: string
                  SousFamille:
                    type: string
                  Marque:
                    type: string
                  Fournisseur:
                    type: string
                  Prix_Achat:
                    type: number
                  Prix_Vente:
                    type: number
                  Taux_TVA_Vente:
                    type: number
                  Tarif:
                    type: string
            example:
              - Produit: "TSHIRT-001"
                Designation: "T-shirt coton"
                Couleur: "BLANC"
                Taille: "M"
                EAN: "3760123456789"
                Rayon: "TEXTILE"
                Famille: "HAUTS"
                Marque: "MARQUE1"
                Prix_Achat: 15.00
                Prix_Vente: 49.90
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec ligne d'en-têtes
            example: |
              Produit	Designation	Couleur	Taille	EAN	Prix_Vente
              TSHIRT-001	T-shirt coton	BLANC	M	3760123456789	49.90
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "Colonne Produit non trouvée"
      security:
        - apiKey: []
          enseigne: []

  /import-tarifs.do:
    post:
      tags:
        - Import Produits
      summary: Importer des tarifs
      description: |
        Import de prix de vente par tarif / produit (table `tarifsproduits`).

        **Permission requise :** `import_tarifs`

        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).

        Colonnes : `Tarif` et `Produit` servent de clés ; `Couleur` et `Taille`
        sont prises en compte si présentes. Les autres colonnes ne sont importées
        que si elles correspondent à une colonne de la table `tarifsproduits`
        (ex. `Prix_Vente`, `Remise_Vente`, `Motif`). Les décimales acceptent la virgule.

        Une ligne avec `Prix_Vente = -1` supprime le tarif correspondant.
        Le tarif est créé automatiquement s'il n'existe pas.
      operationId: importTarifs
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Tarif
                  - Produit
                properties:
                  Tarif:
                    type: string
                  Produit:
                    type: string
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Prix_Vente:
                    type: number
                  Remise_Vente:
                    type: number
                  Motif:
                    type: string
            example:
              - Tarif: "STANDARD"
                Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Prix_Vente: 49.90
                Remise_Vente: 0
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec ligne d'en-têtes
            example: |
              Tarif	Produit	Couleur	Taille	Prix_Vente	Remise_Vente
              STANDARD	TSHIRT-001	BLANC	M	49.90	0
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  # ==================== IMPORT MOUVEMENTS ====================
  /import-receptions.do:
    post:
      tags:
        - Import Mouvements
      summary: Importer des réceptions fournisseurs
      description: |
        Import de réceptions de marchandises (table `mouvements_lignes`).

        **Permission requise :** `import_receptions`

        Formats acceptés : JSON, XLSX, TSV, CSV.

        Option `creation_produits=1` (ou `creation-produits`) pour créer automatiquement
        les produits inexistants via l'API import-produits ; dans ce cas des colonnes
        produit supplémentaires sont acceptées (Designation, Marque, Collection, Saison,
        Matiere, Rayon, Famille, SousFamille, Cle_MEP, Modele, Descriptif, Tags, Unite,
        EAN, Tarif, Prix_Vente, Remise_Vente, Motif).
        Les produits peuvent aussi être identifiés par leur code EAN.
      operationId: importReceptions
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: creation_produits
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: "Créer les produits inexistants (0 ou 1). Alias : creation-produits"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Fournisseur
                  - Date
                  - Reference
                  - Produit
                  - Magasin
                  - Nature
                  - Quantite
                  - Prix_Achat
                properties:
                  Fournisseur:
                    type: string
                    description: Doit exister dans la table fournisseurs
                  Date:
                    type: string
                    description: "Date AAAA-MM-JJ ou JJ/MM/AAAA"
                  Reference:
                    type: string
                    description: Référence du bon de réception
                  Nature:
                    type: string
                    enum: [Réception, Livraison]
                  Magasin:
                    type: string
                    description: Doit exister dans la table magasins
                  Produit:
                    type: string
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Quantite:
                    type: number
                  Prix_Achat:
                    type: number
                  Remise_Achat:
                    type: number
                    description: Optionnel (défaut = 0)
                  Devise:
                    type: string
                    description: Optionnel (défaut = devise du dossier)
                  Taux_Devise:
                    type: number
                    description: Optionnel (résolu depuis la table devises si 0)
                  Commande:
                    type: integer
                    description: Optionnel
                  Colis:
                    type: string
                    description: Optionnel
            example:
              - Fournisseur: "FOURNISSEUR1"
                Date: "2026-02-15"
                Reference: "BL-001"
                Nature: "Réception"
                Magasin: "DEPOT"
                Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Quantite: 100
                Prix_Achat: 15.00
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                champ_absent:
                  value:
                    result: ko
                    error_message: "champ Date absent"
                champ_non_renseigne:
                  value:
                    result: ko
                    error_message: "2 ligne(s) avec Prix_Achat non renseigné"
                produit_inconnu:
                  value:
                    result: ko
                    error_message: "1 produits inconnus (TSHIRT-001 BLANC M)"
      security:
        - apiKey: []
          enseigne: []

  /associer-receptions-commandes.do:
    post:
      tags:
        - Import Mouvements
      summary: Associer a posteriori les réceptions aux commandes fournisseurs
      description: |
        Rattache les lignes de réception non encore associées à une commande
        (`mouvements_lignes.Commande = 0`, de nature `Réception` ou `Livraison`)
        aux lignes de commandes fournisseurs **validées**, en respectant le
        fournisseur, le magasin et l'article (produit/couleur/taille).

        **Permission requise :** `import_receptions`

        Règles de calcul :
        - reste à livrer d'une ligne de commande = `Quantite - Quantite_Livree`
          moins les livraisons déjà associées et en attente (`Nature='Livraison'`) ;
        - allocation gloutonne plafonnée à `min(quantité de la ligne de réception, reste à livrer)` ;
        - si une ligne de réception dépasse le reste à livrer d'une commande, elle est
          **éclatée** : la ligne d'origine est ramenée à la quantité allouée et de
          nouvelles lignes sont créées pour les parts suivantes et l'éventuel reliquat
          (laissé sans commande).

        Deux modes :
        - **prévisualisation** (défaut) : renvoie les propositions sans rien modifier ;
        - **application** (`valider=1`) : exécute les associations (transaction) et renvoie un résumé.

        Aucun corps de requête : tous les paramètres sont passés en query string.
      operationId: associerReceptionsCommandes
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: valider
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = appliquer les associations ; 0 ou absent = prévisualisation seule"
        - name: fournisseur
          in: query
          required: false
          schema:
            type: string
          description: "Filtre optionnel sur le fournisseur (recherche partielle, LIKE)"
        - name: magasin
          in: query
          required: false
          schema:
            type: string
          description: "Filtre optionnel sur le magasin (recherche partielle, LIKE)"
        - name: ordre
          in: query
          required: false
          schema:
            type: string
            enum: [ancienne, recente]
            default: ancienne
          description: |
            Ordre d'allocation quand plusieurs commandes éligibles peuvent recevoir une
            même ligne de réception : `ancienne` (la plus ancienne d'abord, défaut) ou
            `recente` (la plus récente d'abord).
        - name: id_mouvement
          in: query
          required: false
          schema:
            type: integer
          description: |
            Filtre optionnel sur une réception précise (`mouvements.id_mouvement`) : seules
            les lignes de ce mouvement sont traitées. Le mouvement doit être de nature
            `Réception` ou `Livraison`, sinon une erreur est renvoyée.
      responses:
        '200':
          description: |
            Succès. En prévisualisation, renvoie la liste des propositions. En application
            (`valider=1`), renvoie un résumé des associations effectuées.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Réponse en prévisualisation
                    properties:
                      nb_lignes:
                        type: integer
                        description: Nombre de lignes de réception qui seront associées
                      nb_rattachements:
                        type: integer
                        description: Nombre total de rattachements (une ligne peut être éclatée sur plusieurs commandes)
                      propositions:
                        type: array
                        items:
                          type: object
                          properties:
                            Mouvement:
                              type: integer
                              description: Clé de la ligne de réception (mouvements_lignes.Mouvement)
                            Date:
                              type: string
                              description: Date de la réception (AAAA-MM-JJ)
                            Reference:
                              type: string
                            Magasin:
                              type: string
                            Fournisseur:
                              type: string
                            Produit:
                              type: string
                            Couleur:
                              type: string
                            Taille:
                              type: string
                            Nature:
                              type: string
                              enum: [Réception, Livraison]
                            Quantite_Ligne:
                              type: number
                              description: Quantité totale de la ligne de réception
                            Reliquat:
                              type: number
                              description: Part de la ligne laissée sans commande (si éclatement)
                            Associations:
                              type: array
                              items:
                                type: object
                                properties:
                                  Commande:
                                    type: integer
                                  Numero_Commande:
                                    type: string
                                  Date_Commande:
                                    type: string
                                  Quantite:
                                    type: number
                                    description: Quantité allouée à cette commande
                  - type: object
                    description: Réponse en application (valider=1)
                    properties:
                      result:
                        type: string
                        example: ok
                      nb_lignes:
                        type: integer
                      nb_rattachements:
                        type: integer
              examples:
                previsualisation:
                  summary: Prévisualisation (valider absent)
                  value:
                    nb_lignes: 1
                    nb_rattachements: 2
                    propositions:
                      - Mouvement: 4521
                        Date: "2026-02-15"
                        Reference: "BL-001"
                        Magasin: "DEPOT"
                        Fournisseur: "FOURNISSEUR1"
                        Produit: "TSHIRT-001"
                        Couleur: "BLANC"
                        Taille: "M"
                        Nature: "Réception"
                        Quantite_Ligne: 100
                        Reliquat: 0
                        Associations:
                          - Commande: 312
                            Numero_Commande: "CF-000312"
                            Date_Commande: "2026-01-20"
                            Quantite: 60
                          - Commande: 318
                            Numero_Commande: "CF-000318"
                            Date_Commande: "2026-02-02"
                            Quantite: 40
                application:
                  summary: Application (valider=1)
                  value:
                    result: ok
                    nb_lignes: 1
                    nb_rattachements: 2
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                non_autorise:
                  value:
                    result: ko
                    error_message: "not authorized"
                enseigne_inconnue:
                  value:
                    result: ko
                    error_message: "unknown database"
      security:
        - apiKey: []
          enseigne: []

  /import-scanners.do:
    post:
      tags:
        - Import Mouvements
      summary: Importer le contenu d'un scanner
      description: |
        Import du contenu d'un scanner dans la table `scans` (avec `ScannerID=0`).

        **Permission requise :** `import_scanners`

        Formats acceptés : JSON, TSV, CSV. Noms de colonnes insensibles à la casse,
        ordre libre ; toute colonne autre que celles ci-dessous (hormis `Zone`) est ignorée.

        Le body doit comporter au moins 4 colonnes, incluant obligatoirement
        `Produit`, `Couleur`, `Taille`, `Quantite`.

        **Zone** : si le body contient une colonne `Zone`, sa valeur est utilisée ligne par
        ligne ; sinon le paramètre `zone` est appliqué ; si les deux sont vides, la zone prend
        la date et l'heure du jour au format `JJ/MM/AAAA HH:MM`.

        **Contrôles (tout ou rien)** : l'existence de chaque (Produit, Couleur, Taille) est
        vérifiée dans la table `skus`, la quantité doit être numérique ; la moindre erreur
        annule la totalité de l'import.

        Les quantités sont **cumulées** (`Quantite = Quantite + valeur importée`) sur une clé
        (ScannerID, Magasin, Produit, Couleur, Taille, Zone) déjà existante.
      operationId: importScanners
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: magasin
          in: query
          required: false
          schema:
            type: string
          description: "Magasin appliqué à toutes les lignes (facultatif)"
        - name: zone
          in: query
          required: false
          schema:
            type: string
          description: "Zone par défaut si absente du body (facultatif). Défaut : date/heure du jour JJ/MM/AAAA HH:MM"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Produit
                  - Couleur
                  - Taille
                  - Quantite
                properties:
                  Produit:
                    type: string
                    description: Doit exister (combinaison Produit/Couleur/Taille) dans la table skus
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Quantite:
                    type: number
                  Zone:
                    type: string
                    description: Optionnel ; prioritaire sur le paramètre zone
            example:
              - Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Quantite: 12
                Zone: "ALLEE-A"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes (1ère ligne)
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                colonne_absente:
                  value:
                    result: ko
                    error_message: "champ Quantite absent"
                quantite_invalide:
                  value:
                    result: ko
                    error_message: "2 ligne(s) avec une quantité invalide (abc)"
                sku_inconnu:
                  value:
                    result: ko
                    error_message: "1 produit(s)/couleur(s)/taille(s) inexistant(s) dans skus (TSHIRT-001 BLANC M)"
      security:
        - apiKey: []
          enseigne: []

  /import-transferts.do:
    post:
      tags:
        - Import Mouvements
      summary: Importer des transferts inter-magasins
      description: |
        Import de mouvements de transfert entre magasins.
        Chaque transfert crée une demande d'expédition depuis le magasin expéditeur vers le magasin destinataire.
        L'option `reception_immediate` permet de valider automatiquement la réception côté destinataire.
      operationId: importTransferts
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - demande
                  - Magasin_Expediteur
                  - Magasin_Destinataire
                  - Lignes
                properties:
                  demande:
                    type: string
                    enum: [transfert]
                    description: Type de demande (doit être "transfert")
                    example: "transfert"
                  reception_immediate:
                    type: integer
                    enum: [0, 1]
                    default: 0
                    description: "1 = réception automatique côté destinataire, 0 = transfert en attente"
                  ID:
                    type: string
                    description: Identifiant externe pour le suivi (retourné dans la réponse)
                  Date:
                    type: string
                    format: date
                    description: Date du transfert (défaut = date du jour)
                    example: "2026-02-18"
                  Heure:
                    type: string
                    description: Heure du transfert (défaut = heure courante)
                    example: "14:30:00"
                  Magasin_Expediteur:
                    type: string
                    description: Code du magasin expéditeur
                    example: "DEPOT"
                  Magasin_Destinataire:
                    type: string
                    description: Code du magasin destinataire
                    example: "PARIS01"
                  Caisse:
                    type: integer
                    default: 1
                    description: Numéro de caisse
                  Utilisateur:
                    type: string
                    default: "API"
                    description: Utilisateur qui effectue le transfert
                  Lignes:
                    type: array
                    description: Lignes de produits à transférer
                    items:
                      type: object
                      required:
                        - Produit
                        - Quantite
                      properties:
                        Produit:
                          type: string
                          description: Code produit
                        Couleur:
                          type: string
                          description: Code couleur
                        Taille:
                          type: string
                          description: Code taille
                        Designation:
                          type: string
                          description: Désignation (optionnel, récupéré du produit si vide)
                        Quantite:
                          type: number
                          description: Quantité à transférer (doit être > 0)
                          example: 5
                        Prix_Normal:
                          type: number
                          description: Prix normal (optionnel)
                        Prix_Vente:
                          type: number
                          description: Prix de vente (optionnel)
                        Remise_Vente:
                          type: number
                          description: Remise en % (optionnel)
                        Motif:
                          type: string
                          description: Motif du transfert
                        Numero_Serie:
                          type: string
                          description: Numéro de série (si applicable)
            example:
              - demande: "transfert"
                reception_immediate: 1
                ID: "TRF-001"
                Date: "2026-02-18"
                Magasin_Expediteur: "DEPOT"
                Magasin_Destinataire: "PARIS01"
                Lignes:
                  - Produit: "TSHIRT-001"
                    Couleur: "BLANC"
                    Taille: "M"
                    Quantite: 10
                  - Produit: "TSHIRT-001"
                    Couleur: "NOIR"
                    Taille: "L"
                    Quantite: 5
      responses:
        '200':
          description: Résultat de l'import
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok, ko]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: string
                          description: Identifiant externe fourni
                        Entete:
                          type: integer
                          description: Numéro d'entête créé (si succès)
                        Erreur:
                          type: string
                          description: Message d'erreur (si échec)
              examples:
                success:
                  summary: Import réussi
                  value:
                    result: "ok"
                    data:
                      - ID: "TRF-001"
                        Entete: 12345
                error:
                  summary: Import avec erreur
                  value:
                    result: "ko"
                    data:
                      - ID: "TRF-001"
                        Erreur: "Le magasin expéditeur n'existe pas"
      security:
        - apiKey: []
          enseigne: []

  # ==================== IMPORT DIVERS ====================
  /import-fournisseurs.do:
    post:
      tags:
        - Import Divers
      summary: Importer des fournisseurs
      description: |
        Import de fiches fournisseurs (création ou mise à jour sur clé unique).

        **Permission requise :** `import_fournisseurs`

        Formats acceptés : JSON, XLSX, TSV, CSV. L'ordre des colonnes est libre ;
        chaque colonne de l'en-tête doit correspondre à un champ de la table `fournisseurs`.
      operationId: importFournisseurs
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  Fournisseur:
                    type: string
                    maxLength: 30
                  Contact:
                    type: string
                  Telephone:
                    type: string
                  Email:
                    type: string
                  Adresse:
                    type: string
                  CodePostal:
                    type: string
                  Ville:
                    type: string
                  Pays:
                    type: string
            example:
              - Fournisseur: "FOURNISSEUR1"
                Contact: "Jean Dupont"
                Email: "contact@fournisseur1.com"
                Telephone: "+33123456789"
                Ville: "LYON"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /import-min-max.do:
    post:
      tags:
        - Import Divers
      summary: Importer des min/max de stock
      description: |
        Import des seuils min/max pour le réassort (table `produits_min_max`).

        **Permission requise :** `import_min_max`

        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).

        Clés : `Profil_Stock`, `Produit` ; `Couleur` et `Taille` sont prises en compte
        si présentes. Les autres colonnes (ex. `Mini`, `Maxi`) sont insérées dans
        `produits_min_max`. Le profil de stock est créé automatiquement s'il n'existe pas.
      operationId: importMinMax
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Profil_Stock
                  - Produit
                properties:
                  Profil_Stock:
                    type: string
                  Produit:
                    type: string
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Mini:
                    type: integer
                  Maxi:
                    type: integer
            example:
              - Profil_Stock: "STANDARD"
                Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Mini: 5
                Maxi: 20
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec en-têtes
            example: |
              Profil_Stock	Produit	Couleur	Taille	Mini	Maxi
              STANDARD	TSHIRT-001	BLANC	M	5	20
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /import-champs-perso.do:
    post:
      tags:
        - Import Divers
      summary: Importer des champs personnalisés
      description: |
        Import de valeurs pour les champs personnalisés (table `champs_perso`).

        **Permission requise :** `import_champs_perso`

        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).

        Colonnes obligatoires : `Nature`, `Nom`, `Clef`, `Valeur`.
        Le type de champ perso est créé automatiquement dans `liste_champs_perso` s'il n'existe pas.
        Une `Valeur` vide supprime la valeur existante pour cette `Nature`/`Nom`/`Clef`.
      operationId: importChampsPerso
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Nature
                  - Nom
                  - Clef
                  - Valeur
                properties:
                  Nature:
                    type: string
                    description: "Nature de l'objet (ex. produits, produits_couleurs, skus)"
                  Nom:
                    type: string
                  Clef:
                    type: string
                  Valeur:
                    type: string
            example:
              - Nature: "produits"
                Nom: "Poids_Net"
                Clef: "TSHIRT-001"
                Valeur: "200g"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec en-têtes
            example: |
              Nature	Nom	Clef	Valeur
              produits	Poids_Net	TSHIRT-001	200g
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                champ_manquant:
                  value:
                    result: ko
                    error_message: "Champ Valeur manquant"
                permission:
                  value:
                    result: ko
                    error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /envoyer-message.do:
    post:
      tags:
        - Import Divers
      summary: Envoyer un message inter-magasins
      description: |
        Envoie un message interne d'un magasin expéditeur vers un magasin destinataire.
        Tous les paramètres sont passés en query string.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: magasin-expediteur
          in: query
