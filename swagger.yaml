              - confirmation_reception_fournisseur
              - get_envoi_logistique_receptions
              - set_envoi_logistique_receptions
              - get_statut_entetes
              - set_statut_entetes
              - get_statut_traitement_entetes
              - set_statut_traitement_entetes
              - get_tracking_number
              - set_tracking_number
              - get_tracking_number_negoce
