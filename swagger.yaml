        **Permission requise :** `api_logistique`
        
        Actions disponibles :
        - `confirmation_reception_transfert` : Confirmer réception d'un transfert entrant
        - `confirmations_expeditions` : Confirmer des expéditions
        - `confirmation_reception_fournisseur` : Confirmer réception fournisseur
        - `get_envoi_logistique_receptions` / `set_envoi_logistique_receptions` : Statut envoi
        - `get_statut_entetes` / `set_statut_entetes` : Statuts entêtes
        - `get_statut_traitement_entetes` / `set_statut_traitement_entetes` : Statuts traitement
        - `get_tracking_number` / `set_tracking_number` : Numéros de suivi
