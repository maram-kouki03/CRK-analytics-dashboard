                    properties:
                      Preparation:
                        type: integer
                        description: Numéro de préparation
                      date_preparation:
                        type: string
                        format: date
                      heure_preparation:
                        type: string
                        format: time
                      Produits:
                        type: array
                        items:
                          type: object
                          properties:
                            Produit:
                              type: string
                            Couleur:
                              type: string
                            Taille:
                              type: string
                            Quantite:
                              type: number
                            Colis:
                              type: integer
                - title: confirmation_reception_fournisseur
                  type: object
                  properties:
                    id_mouvement:
                      type: integer
