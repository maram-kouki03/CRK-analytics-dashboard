          description: Numéro de commande fournisseur
          example: "12345"
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
            example: |
              Date	Numero_Bon_Livraison	Colis	Reference_Colis	Magasin	Produit	Couleur	Taille	Quantite
              15/02/2026	BL-001	1	COL-001	DEPOT	TSHIRT-001	BLANC	M	50
              15/02/2026	BL-001	1	COL-001	DEPOT	TSHIRT-001	BLANC	L	30
