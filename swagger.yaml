            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
